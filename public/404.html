<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA redirect workaround
    // Carry the original path through the redirect. A query parameter is more
    // reliable across GitHub Pages' separate 404 document.
    const redirectPath = location.pathname + location.search + location.hash;
    location.replace(
      location.origin + '/blueprints-app/?redirect=' + encodeURIComponent(redirectPath)
    );
  </script>
</head>
<body>
  <p>Redirecting to Blueprints...</p>
</body>
</html>
